name: Deploy PIOS

on:
  push:
    branches: [main]
    paths:
      - 'pios/**'
      - '.github/workflows/pios-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pios-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate frontend JavaScript
        run: |
          set -e
          for file in pios/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Test organized product navigation
        run: node pios/tests/command-navigation.test.mjs
      - name: Test person-specific intelligence
        run: node pios/tests/personal-consequence.test.mjs
      - name: Test Executive Intelligence Council
        run: node pios/tests/executive-council.test.mjs
      - name: Assemble production shell
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('pios/index.html')
          html = page.read_text()
          css_needle = '<link rel="stylesheet" href="./styles.css" />'
          css_files = ['intelligence-ui.css','outcome-ui.css','twin-ui.css','operating-ui.css','life-twin-ui.css']
          for css in css_files:
              tag = f'<link rel="stylesheet" href="./{css}" />'
              if tag not in html:
                  html = html.replace(css_needle, css_needle + '\n  ' + tag)
                  css_needle = tag
          script_needle = '<script src="./app.js"></script>'
          scripts = ['session-guard.js','app.js','product-guard.js','intelligence-ui.js','outcome-ui.js','twin-ui.js','operating-ui.js','life-twin-ui.js','model-truth-ui.js','alignment-ui.js']
          if 'session-guard.js' not in html:
              block='\n'.join(f'<script src="./{s}"></script>' for s in scripts)
              html = html.replace(script_needle, block)
          else:
              for s in ['intelligence-ui.js','outcome-ui.js','twin-ui.js','operating-ui.js','life-twin-ui.js','model-truth-ui.js','alignment-ui.js']:
                  tag=f'<script src="./{s}"></script>'
                  if tag not in html:
                      html = html.replace('</body>', tag+'\n</body>')
          page.write_text(html)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload PIOS site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pios
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
