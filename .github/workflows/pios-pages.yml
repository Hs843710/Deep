name: Deploy PIOS

on:
  push:
    branches: [main]
    paths:
      - 'pios/**'
      - '.github/workflows/pios-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pios-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble production shell
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('pios/index.html')
          html = page.read_text()
          css_needle = '<link rel="stylesheet" href="./styles.css" />'
          css_files = ['intelligence-ui.css','outcome-ui.css','twin-ui.css']
          for css in css_files:
              tag = f'<link rel="stylesheet" href="./{css}" />'
              if tag not in html:
                  html = html.replace(css_needle, css_needle + '\n  ' + tag)
                  css_needle = tag
          script_needle = '<script src="./app.js"></script>'
          scripts = ['session-guard.js','app.js','product-guard.js','intelligence-ui.js','outcome-ui.js','twin-ui.js']
          if 'session-guard.js' not in html:
              block='\n'.join(f'<script src="./{s}"></script>' for s in scripts)
              html = html.replace(script_needle, block)
          else:
              anchor='<script src="./outcome-ui.js"></script>'
              if 'twin-ui.js' not in html:
                  if anchor in html:
                      html = html.replace(anchor, anchor+'\n<script src="./twin-ui.js"></script>')
                  else:
                      html = html.replace('</body>', '<script src="./twin-ui.js"></script>\n</body>')
          page.write_text(html)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload PIOS site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pios
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
