name: Deploy PIOS

on:
  push:
    branches: [main]
    paths:
      - 'pios/**'
      - '.github/workflows/pios-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pios-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload PIOS site
        uses: actions/upload-pages-artifact@v4
        with:
          path: pios
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
