name: Deploy PIOS

on:
  push:
    branches: [main]
    paths:
      - 'pios/**'
      - '.github/workflows/pios-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pios-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble production shell
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('pios/index.html')
          html = page.read_text()
          css_needle = '<link rel="stylesheet" href="./styles.css" />'
          if 'intelligence-ui.css' not in html:
              html = html.replace(css_needle, css_needle + '\n  <link rel="stylesheet" href="./intelligence-ui.css" />')
          script_needle = '<script src="./app.js"></script>'
          scripts = '<script src="./session-guard.js"></script>\n<script src="./app.js"></script>\n<script src="./product-guard.js"></script>\n<script src="./intelligence-ui.js"></script>'
          if 'session-guard.js' not in html:
              html = html.replace(script_needle, scripts)
          elif 'intelligence-ui.js' not in html:
              html = html.replace('<script src="./product-guard.js"></script>', '<script src="./product-guard.js"></script>\n<script src="./intelligence-ui.js"></script>')
          page.write_text(html)
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload PIOS site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pios
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
